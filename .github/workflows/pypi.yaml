# yamllint disable rule:truthy
---
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # nothing reaches PyPI unless the tests pass first
  test:
    runs-on: ubuntu-latest
    name: Test before publishing

    strategy:
      matrix:
        python-version: ['3.10', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          pip install pytest
          pip install -e .

      - name: Unit tests
        run: pytest --verbose tests --ignore=tests/test_all_notebooks.py

  publish:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: pypi-repository
      url: https://pypi.org/p/ofiber

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          attestations: true
