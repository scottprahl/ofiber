[build-system]
requires = ["setuptools>=77"]  # setuptools absorbed bdist_wheel in 70.1
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ofiber"]

[tool.setuptools.dynamic]
version = {attr = "ofiber.__version__"}

[project]
name = "ofiber"
authors = [
    { name = "Scott Prahl", email = "scott.prahl@oit.edu" }
]
description = "Light Propagation in Optical Fibers"
keywords = [
    "refraction",
    "Sellmeier",
    "modes",
    "dispersion",
    "graded index",
    "gradient index",
    "single mode",
    "multimode",
    "step index",
    "erbium",
    "waveguide",
    "planar",
    "cylindrical",
    ]
readme = "README.rst"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
docs = [
  "Sphinx>=8.1.3",
  "nbsphinx>=0.9.7",
  "sphinx_automodapi",
  "sphinx_rtd_theme",
  "ipython",
]

dev = [
  # Testing
  "pytest",
  "pytest-cov",

  # Lint / QA
  "ruff",
  "yamllint",
  "rstcheck[sphinx,toml]",
  "pylint",
  "pyroma",
  "black[jupyter]",

  # Release / packaging checks
  # setuptools is not listed: check-manifest and pyroma both require it, and the
  # backend is installed by build isolation, so an explicit pin adds nothing
  "build",
  "check-manifest",
  "libarchive-c",
  "pyyaml",

  # Notebooks (local JupyterLab workflows)
  "jupyterlab",
  "nbconvert",
  "nbformat",
]

lite = [
  "jupyterlite-core>=0.7,<0.8",
  "jupyterlite-pyodide-kernel>=0.7,<0.8",
]

[project.urls]
Homepage = "https://github.com/scottprahl/ofiber"
Documentation = "https://ofiber.readthedocs.io"
Source = "https://github.com/scottprahl/ofiber"
Tracker = "https://github.com/scottprahl/ofiber/issues"
Changelog = "https://github.com/scottprahl/ofiber/blob/main/docs/CHANGELOG.rst"

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.pylint]
disable = [
    "C0103", "C0209", "C0302",
    "R0902", "R0904", "R0912", "R0913", "R0914", "R0915", "R0917", "R1702",
    "W0511"
]
max-line-length = 120

[tool.ruff]
line-length = 120
exclude = ["docs", ".venv"]
lint.select = ["D", "E", "F", "W"]
lint.ignore = ["D200", "D212", "F403"]
lint.pydocstyle.convention = "google"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.check-manifest]
ignore = [
  ".readthedocs.yaml",
  ".jupyterlite-ignore",
  "Makefile",
  "requirements-dev.txt",
  "jupyter_lite_config.json",
  "docs/*",
  "docs/**/*",
  "release.txt",
  "todo.rst",
]

